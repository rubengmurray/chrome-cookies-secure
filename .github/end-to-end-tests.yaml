name: End-to-End Tests

on: [push, pull_request]

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    
    strategy:
      # If one version fails, don't cancel the others—let them finish running
      fail-fast: false
      matrix:
        node-version: [22.18.0, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install System Dependencies for Chrome & Keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libsecret-1-0 gnome-keyring

      - name: Install Playwright Chromium Binary
        run: npx playwright install chromium

      - name: Run E2E Tests with Mock Keyring
        run: |
          dbus-run-session -- xvfb-run --server-args="-screen 0 1024x768x24" npm run test:e2e